[package]
name = "patina-abi"
version = "0.1.0"
edition = "2021"
description = "Linux x86_64/aarch64 syscall ABI: numbers, errno, flags, #[repr(C)] structs, signal frames"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
bitflags = { version = "2", default-features = false }
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
