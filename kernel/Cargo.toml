[package]
name = "patina-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "patina-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
bitflags = "2.9"
patina-abi = { path = "../crates/abi" }
patina-cmdline = { path = "../crates/cmdline" }
patina-cpio = { path = "../crates/cpio" }
patina-ctlproto = { path = "../crates/ctlproto" }
patina-fsutil = { path = "../crates/fsutil" }
patina-loader = { path = "../crates/loader" }
patina-rand = { path = "../crates/rand" }
patina-vfs = { path = "../crates/vfs" }
patina-vdso = { path = "../crates/vdso" }
patina-inet = { path = "../crates/inet" }
smoltcp = { version = "=0.14.0", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "proto-dhcpv4",
    "socket-tcp",
    "socket-udp",
    "socket-dhcpv4",
    "auto-icmp-echo-reply",
    "iface-max-addr-count-8",
    "iface-max-route-count-4",
    "iface-neighbor-cache-count-32",
] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
fdt = "0.1.5"
