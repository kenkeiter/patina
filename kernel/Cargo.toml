[package]
name = "patina-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "patina-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
bitflags = "2.9"
buddy_system_allocator = { version = "0.13", default-features = false }
patina-abi = { path = "../crates/abi" }
patina-cmdline = { path = "../crates/cmdline" }
patina-cpio = { path = "../crates/cpio" }
patina-fsutil = { path = "../crates/fsutil" }
patina-loader = { path = "../crates/loader" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
fdt = "0.1.5"
